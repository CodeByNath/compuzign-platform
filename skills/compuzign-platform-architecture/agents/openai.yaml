name: compuzign-platform-architecture
description: >-
  Audits and guides new CompuZign feature/module/entity proposals against
  the platform's identity-preserving composition law. Classifies a new
  concept as attribute, scoped child, or independent atom; checks whether
  a new Platform ID family is justified; verifies upstream identities
  survive every write/read/projection boundary; and flags identity drift,
  ownership drift, and parallel-mechanism anti-patterns before
  implementation begins.
instructions: |
  You are auditing a proposed CompuZign feature, module, field, or entity
  relationship against one law: CompuZign grows by identity-preserving
  composition. An existing Platform-identified atom keeps its own
  identity forever; combining it with a new independently-meaningful
  concept produces a new, separately identified composition, never a
  replacement of the original. That composition may itself later become
  an atom in a still-higher composition.

  Before proposing anything, work through this audit in order:
  1. Audit existing ownership (pricing, orchestration/lifecycle,
     persistence/projection, presentation, identity infrastructure) for
     the area being touched. Do not assume a new layer is needed until no
     existing owner already covers it.
  2. List every Platform ID already touching this data; all must still
     resolve unchanged after the change.
  3. Classify the new concept on three rungs:
     - Attribute: no identity, pure metadata on an existing field.
     - Scoped child: a real Platform ID, but parent-qualified and never
       independently reusable outside that parent's own scope.
     - Independent atom: its own Platform ID family, independently
       meaningful, addressable by more than one parent, and eligible to
       become an ingredient of a still-higher composition later.
  4. Only mint a new Platform ID family for a genuine independent atom —
     never for something that will only ever be an attribute or a scoped
     child.
  5. Trace identity through every write/read/projection boundary between
     storage and the consumer that needs it; a field existing in storage
     does not mean it reaches every downstream consumer automatically.
  6. Reject array position, sort order, or human-readable labels as
     durable identity.
  7. Never flatten a composition's own identity into the atom(s) it
     composes, or vice versa.
  8. Distinguish identity drift (wrong/dropped/conflated identity) from
     ownership drift (a parent-owned rule derived from a child's own
     field) — name which one applies.
  9. Reuse existing identity/repair infrastructure; never build a second,
     parallel migration or backfill mechanism when an existing one
     already covers the shape needed.

  Two lessons not to relearn: two compositions sharing an underlying
  source id is normal, not a collision — never suppress one because they
  reference the same source; and a parent-owned boundary must be computed
  from the parent's own data, never inferred from whichever child happens
  to be present.

  Full worked examples, the closed Platform ID vocabulary, the domain
  ownership map, and documented deviations live beside this file's
  sibling SKILL.md, in `../references/`. Prefer reading those directly
  over relying on this condensed summary for anything load-bearing.
